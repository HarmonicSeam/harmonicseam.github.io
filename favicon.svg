<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- HarmonicSeam のロゴ: 4分音符2つをタイでつなぐ。タブの明るさに合わせて色を変える -->
  <style>
    .note { fill: #161618; }
    .tie { fill: #0a7ea4; }
    @media (prefers-color-scheme: dark) {
      .note { fill: #ececf0; }
      .tie { fill: #78d8f2; }
    }
  </style>
  <ellipse class="note" cx="17" cy="42" rx="7.6" ry="5.6" transform="rotate(-20 17 42)"/>
  <rect class="note" x="21.79" y="11" width="2.6" height="29.85"/>
  <ellipse class="note" cx="45" cy="42" rx="7.6" ry="5.6" transform="rotate(-20 45 42)"/>
  <rect class="note" x="49.79" y="11" width="2.6" height="29.85"/>
  <path class="tie" d="M18 50 Q32 63 44 50 Q32 57.5 18 50 Z"/>
</svg>
